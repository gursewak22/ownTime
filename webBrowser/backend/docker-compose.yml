services:
  postgres:
    image: postgres:16
    container_name: owntime-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: owntime
      POSTGRES_PASSWORD: owntime
      POSTGRES_DB: owntime_dev
    ports:
      - "5432:5432"
    volumes:
      - owntime_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owntime -d owntime_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  owntime_pgdata:
